defaults:
  - base
  - _self_

molecule_opt_task: "drd2+qed"
molecule_opt_similarity_threshold: 0.4
train_size: 128

number_of_gpus: 2

system:
  CUDA_VISIBLE_DEVICES: "${cuda_devices:${number_of_gpus}}"
trainer:
  experiment_name: molmem-${train_size}-${molecule_opt_task}
  project_name: molmem_experiments
  total_training_steps: 100
  save_freq: 20
  default_local_dir: ./checkpoints/${trainer.project_name}/${trainer.experiment_name}
  n_gpus_per_node: ${number_of_gpus}

agent_proxy:
  max_turn: 5
  max_actions_per_turn: 1

data:
  train_file: "./data/${molecule_opt_task}/train/${molecule_opt_task}_train_${train_size}.parquet"
  val_file: "./data/${molecule_opt_task}/val/${molecule_opt_task}_val_32.parquet"
  smiles_column: "smiles"
  max_prompt_length: 2048

es_manager:
  train:
    env_groups: 128
    group_size: 16
    env_configs:
      tags: ["MoleculeOptimization"]
      n_groups: [128]
  val:
    env_groups: 32
    group_size: 1
    env_configs:
      tags: ["MoleculeOptimization"]
      n_groups: [32]

model_path: AlexanderWang915/qwen2.5-1.5b-moloptins

static_exemplar_memory:
  url: "http://127.0.0.1:8000/retrieve"
  topk: 50
  hint_topk: 3
  timeout: 5.0
  trigger_mode: "on_stuck"
  no_improvement_threshold: 2
  rollback_threshold: 1
  max_triggers: 2
  min_improvement_margin: 0.0

evolving_skill_memory:
  max_size: 1000
  save_path: "${trainer.default_local_dir}/skill_memory.json"
  min_step_for_experience: 5
  min_step_for_hints: 5

  extraction:
    min_score_delta: 0.1

  hints:
    trigger_mode: "on_stuck"
    trigger_mode_val: "on_stuck"
    no_improvement_threshold: 2
    rollback_threshold: 1

  retrieval:
    top_k_by_fg: 3
    top_k_by_similarity: 2
    similarity_threshold: 0.5
    min_jaccard: 0.8

  gpt_summary:
    model: "${oc.env:AZURE_OPENAI_DEPLOYMENT,gpt-4o}"
    credential_env_prefix: "AZURE_OPENAI"
    max_completion_tokens: 150
    reasoning_effort: "none"
    total_timeout: 600
    max_workers: 8

micro_batch_size_per_gpu: 2
ppo_mini_batch_size: 32

algorithm:
  adv_estimator: gae
  gamma: 0.99
  lam: 0.95

actor_rollout_ref:
  actor:
    checkpoint:
      contents: ['model', 'optimizer', 'extra']
  rollout:
    filter_mode: two_stage
    variance_filter_ratio: 0.5
    variance_filter_type: std
    score_filter_ratio: 0.75
    tensor_model_parallel_size: ${number_of_gpus}
    max_model_len: 4096
    gpu_memory_utilization: 0.5
    response_length: 400
    max_num_batched_tokens: 4096
    enable_smart_truncation: true
    enable_length_filtering: true
