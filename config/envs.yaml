molecule_opt_task: qed
molecule_opt_similarity_threshold: 0.4

custom_envs:
  MoleculeOptimization:
    env_type: molecule_opt
    max_actions_per_traj: 5
    molecule_opt_task: ${molecule_opt_task}
    molecule_opt_similarity_threshold: ${molecule_opt_similarity_threshold}
    max_tokens: 100
    env_config:
      final_similarity_threshold: null
      max_steps: 5
      max_heavy_atoms: 60
      max_carbon_chain_length: 10
      multi_objective_weights:
        logp: 0.5
        qed: 0.5
      oracle_config:
        cache_file: null
    # The task-specific instruction is generated by ContextManager.
    env_instruction: null
